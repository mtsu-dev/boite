[[permission]]
identifier = "allow-shell"
description = "Allows the local main UI to invoke the desktop shell commands."
commands.allow = [
  "core_endpoint",
  "core_starting",
  "open_local_file",
  "open_chat_file",
  "save_attachment",
  "dropped_entries",
  "dropped_file",
  "save_attachment_url",
  "shell_ready",
  "show_window",
  "whip_window",
  "quit_shell",
  "quit_guard",
  "notify",
  "user_presence",
  "close_behavior",
  "launch_at_login",
  "app_update_status",
  "app_update_check",
  "app_update_download",
  "app_update_install",
  "app_update_install_quietly",
  "app_update_cancel_install",
  "quota_window",
  "pointer_show",
  "pointer_hide",
  "pointer_layout",
  "window_material",
  "window_material_supported",
  "tray_labels",
  "browser_create",
  "browser_navigate",
  "browser_back",
  "browser_forward",
  "browser_reload",
  "browser_set_bounds",
  "browser_set_zoom",
  "browser_annotate",
  "browser_highlight",
  "browser_destroy",
  "browser_profile_delete",
  "browser_protocol",
  "browser_protocol_events",
  "browser_cookies",
  "browser_set_cookies",
  "browser_screencast_start",
  "browser_screencast_stop",
]

[[permission]]
identifier = "allow-pointer-ui"
description = "Allows a pointer window to read the box it draws."
commands.allow = ["pointer_layout"]

[[permission]]
identifier = "allow-quota-ui"
description = "Allows the local quota popup to connect to the core and use its tray controls."
commands.allow = ["core_endpoint", "quota_window"]
