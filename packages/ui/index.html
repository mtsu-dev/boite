<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="theme-color" content="#101013" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <title>Boite</title>
    <!-- Painted before the stylesheet arrives, so a reload never flashes the wrong ground. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--color-background, #101013);
        color: var(--color-foreground, #ececf1);
        overflow: hidden;
      }

      html[data-theme='light'],
      html[data-theme='light'] body {
        background: var(--color-background, #f3f3f6);
        color: var(--color-foreground, #1c1c21);
      }

      /* The pointer's page is a transparent window above the user's apps: it paints no ground at all. */
      html[data-view='pointer'],
      html[data-view='pointer'] body {
        background: transparent !important;
      }

      /* Grain paints its fade from the stylesheet; the mid tone stands in until then. */
      html[data-theme='grain'],
      html[data-theme='grain'] body {
        background: #2a2a31;
        color: #ececf1;
      }
    </style>
    <!-- The same rule as lib/theme.ts, run before the first paint: dark stamps nothing. -->
    <script>
      var shellView = new URLSearchParams(location.search).get('view');
      if (shellView === 'quotas' || shellView === 'pointer') document.documentElement.dataset.view = shellView;
      try {
        // The face picked under Appearance (lib/fonts.ts), stamped and preloaded
        // before the stylesheet so the first frame is drawn in it. The sans face
        // only: the first screen draws no mono text, and on a slow link a mono
        // file would compete with the entry chunk.
        var faces = { inter: 'Inter-latin', atkinson: 'AtkinsonHyperlegibleNext-latin', source: 'SourceSans3-latin', plex: 'IBMPlexSans-latin', system: '' };
        var face = localStorage.getItem('boite.font');
        if (face === null || !Object.prototype.hasOwnProperty.call(faces, face)) face = 'inter';
        if (face !== 'inter') document.documentElement.dataset.font = face;
        var mono = localStorage.getItem('boite.font-mono');
        if (mono === 'jetbrains' || mono === 'system') document.documentElement.dataset.mono = mono;
        var preloadFont = function (file) {
          var preload = document.createElement('link');
          preload.rel = 'preload';
          preload.as = 'font';
          preload.type = 'font/woff2';
          preload.crossOrigin = 'anonymous';
          preload.href = './fonts/' + file + '.woff2';
          document.head.appendChild(preload);
        };
        if (faces[face]) preloadFont(faces[face]);
        var accent = localStorage.getItem('boite.accent-hue');
        if (accent !== null && Number.isFinite(Number(accent)) && Number(accent) >= 0 && Number(accent) <= 360) document.documentElement.style.setProperty('--accent-hue', accent);
        var stored = localStorage.getItem('boite.theme');
        var theme = stored === 'dark' || stored === 'light' || stored === 'grain' ? stored : 'system';
        // Grain rides behind an experiment: a stored choice with the switch off is System again.
        if (theme === 'grain') {
          var on = false;
          try {
            var raw = localStorage.getItem('boite.experiments');
            on = raw !== null && JSON.parse(raw).indexOf('theme-grain') !== -1;
          } catch (e) {}
          if (!on) theme = 'system';
        }
        if (theme === 'grain') {
          document.documentElement.dataset.theme = 'grain';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1a1a1e');
        } else {
          var light =
            theme === 'light' ||
            (theme === 'system' &&
              typeof window.matchMedia === 'function' &&
              window.matchMedia('(prefers-color-scheme: light)').matches);
          if (light) {
            document.documentElement.dataset.theme = 'light';
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f3f3f6');
          }
        }
      } catch (e) {}
    </script>
    <!-- main.ts sets the flag first; a page that loaded without it never ran the app.
         A browser under the floor (Safari 15.4, Chrome 111: docs/phone.md) fails to
         parse it, and says so. A browser that has what the floor has failed before
         the entry ran, most often on a chunk lost on the way (offline, a dropped
         connection), sometimes on a module that threw: it offers to load again, and
         does so by itself once the browser is back online. The catalogues never loaded,
         so each sentence is here once per language of LOCALES;
         src/lib/boot-notice.test.ts checks that. -->
    <script>
      window.addEventListener('load', function () {
        var app = document.getElementById('app');
        if (window.__boiteBooted || !app || app.childElementCount > 0) return;
        // Safari 15.4 and Chrome 111 are the first to have all four.
        var floor = false;
        try {
          floor =
            typeof Array.prototype.at === 'function' &&
            typeof Object.hasOwn === 'function' &&
            typeof structuredClone === 'function' &&
            CSS.supports('color', 'oklch(0 0 0)');
        } catch (e) {}
        var notices = {
          en: {
            old: 'Boite cannot start in this browser. It needs Safari 15.4 (iOS 15.4) or Chrome 111, or a newer version.',
            lost: 'Boite could not load. Check the connection, then try again.',
            retry: 'Try again'
          },
          fr: {
            old: 'Boite ne peut pas démarrer dans ce navigateur. Il faut Safari 15.4 (iOS 15.4) ou Chrome 111, ou une version plus récente.',
            lost: "Boite n'a pas pu se charger. Vérifiez la connexion, puis réessayez.",
            retry: 'Réessayer'
          }
        };
        var language = (navigator.language || '').toLowerCase().split('-')[0];
        var text = Object.prototype.hasOwnProperty.call(notices, language) ? notices[language] : notices.en;
        var note = document.createElement('div');
        note.setAttribute('role', 'alert');
        note.style.cssText = 'margin:0;padding:32px 24px;max-width:520px;font:15px/1.5 system-ui,-apple-system,sans-serif';
        var line = document.createElement('p');
        line.style.margin = '0';
        line.textContent = floor ? text.lost : text.old;
        note.appendChild(line);
        if (floor) {
          var again = document.createElement('button');
          again.type = 'button';
          again.textContent = text.retry;
          again.style.cssText = 'margin-top:16px;padding:8px 16px;font:inherit;color:inherit;background:none;border:1px solid currentColor;border-radius:8px;cursor:pointer';
          again.addEventListener('click', function () { location.reload(); });
          note.appendChild(again);
          window.addEventListener('online', function () { location.reload(); });
        }
        app.appendChild(note);
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
