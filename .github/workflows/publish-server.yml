name: publish server

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: publish-server-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verified:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-nightly.')
    runs-on: ubuntu-24.04
    outputs:
      amd64: ${{ steps.proof.outputs.amd64 }}
      arm64: ${{ steps.proof.outputs.arm64 }}
      prerelease: ${{ steps.proof.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/ci/release-version.ts
      - name: Require the exact tested release run and persisted digests
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p proof
          gh release download "$RELEASE_TAG" --pattern server-images.json --dir proof
          bun scripts/ci/server-provenance.ts inspect proof/server-images.json > proof/coordinates.json
          run_id=$(jq -r .runId proof/coordinates.json)
          attempt=$(jq -r .runAttempt proof/coordinates.json)
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > proof/release.json
          gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" > proof/tag.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$attempt" > proof/run.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=all&per_page=100" | jq '[.[].jobs[]]' > proof/jobs.json
          bun scripts/ci/server-provenance.ts verify proof/server-images.json proof/release.json proof/run.json proof/jobs.json proof/tag.json

  publish:
    needs: verified
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the tested version tag and compatibility SHA alias
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DIGEST_AMD64: ${{ needs.verified.outputs.amd64 }}
          DIGEST_ARM64: ${{ needs.verified.outputs.arm64 }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/boite-server"
          docker buildx imagetools create --tag "$image:$RELEASE_TAG" --tag "$image:sha-$GITHUB_SHA" "$DIGEST_AMD64" "$DIGEST_ARM64"

  latest:
    needs: [verified, publish]
    if: needs.verified.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Version tags may publish in parallel; only this shared alias needs a lock.
    concurrency:
      group: publish-server-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move latest only for GitHub's current stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          DIGEST_AMD64: ${{ needs.verified.outputs.amd64 }}
          DIGEST_ARM64: ${{ needs.verified.outputs.arm64 }}
        run: |
          # Recheck under the shared lock, after the version tag was promoted.
          # A failed API lookup must never move latest.
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > latest-release.json
          latest=$(bun scripts/ci/server-provenance.ts latest latest-release.json)
          if [[ "$latest" == latest ]]; then
            image="ghcr.io/${GITHUB_REPOSITORY,,}/boite-server"
            docker buildx imagetools create --tag "$image:latest" "$DIGEST_AMD64" "$DIGEST_ARM64"
          fi
