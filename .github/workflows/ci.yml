name: ci

on:
  push:
    branches: [main]
  # A pull request, draft or ready, runs Linux, plus native Windows for
  # protection inputs; the merge queue runs the full matrix on top of main
  # (docs/ci.md#pull-request-runs).
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        description: Required only when sign-updates is enabled.
        required: false
      # A published macOS build is signed with this Developer ID and notarized
      # when all six are set; without them it stays ad-hoc signed.
      APPLE_CERTIFICATE:
        description: Base64 of the Developer ID Application .p12.
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        description: 'Developer ID Application: <name> (<team id>).'
        required: false
      APPLE_API_ISSUER:
        description: App Store Connect API issuer ID, for notarization.
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_PRIVATE_KEY:
        description: Contents of the AuthKey_<id>.p8 file.
        required: false
    inputs:
      force:
        type: boolean
        default: true
      skip-server:
        type: boolean
        default: false
      sign-updates:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A main run finishes: merges land faster than a run takes, so cancelling
  # left main without a green commit to publish (docs/ci.md#run-modes-and-platforms).
  # A newer push only replaces the pending one.
  cancel-in-progress: ${{ github.workflow == 'ci' && github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: 8

jobs:
  changes:
    name: Plan and repository checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # A main push compares with the last main commit whose CI passed (changes.ts).
      actions: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
      shellRust: ${{ steps.filter.outputs.shellRust }}
      server: ${{ steps.filter.outputs.server == 'true' && !inputs.skip-server }}
      size: ${{ steps.filter.outputs.size }}
      android: ${{ steps.filter.outputs.android }}
      androidServer: ${{ steps.filter.outputs.androidServer }}
      e2e: ${{ steps.filter.outputs.e2e }}
      telemetry: ${{ steps.filter.outputs.telemetry }}
      e2eTypes: ${{ steps.filter.outputs.e2eTypes }}
      stress: ${{ steps.filter.outputs.stress }}
      portable: ${{ steps.filter.outputs.portable }}
      coreRunners: ${{ steps.filter.outputs.coreRunners }}
      nativeWindows: ${{ steps.filter.outputs.nativeWindows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          GH_TOKEN: ${{ github.token }}
          FORCE_CHECKS: ${{ inputs.force || github.ref_type == 'tag' || (github.event_name != 'push' && github.event_name != 'pull_request' && github.event_name != 'merge_group') }}
        run: bun scripts/ci/changes.ts
      - run: bun install --frozen-lockfile
      - name: Audit frozen dependencies
        # GHSA-gcqx-w48m-w2h4 (low): deepmerge 4.3.1, the latest release, has no fix.
        # Only @sveltejs/vite-plugin-svelte uses it, merging build configuration.
        # Drop the ignore once a patched deepmerge or plugin ships.
        run: bun audit --ignore=GHSA-gcqx-w48m-w2h4
      - run: bun scripts/check-docs.ts
      - run: bun test scripts/ci scripts/migrate ./bench ./apps/shell/scripts ./apps/android-server
      # Missing sentences are warnings here and in the nightly; release.yml refuses them.
      - run: bun scripts/ci/translations.ts
      - run: bun run check:copy
      - run: bun run check:architecture
      - run: bun test scripts/architecture
      - name: Validate workflows
        if: steps.filter.outputs.workflows == 'true'
        run: |
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  # The ruleset requires each check name a pull request reports
  # (docs/ci.md#check-names). Outside every needs chain: a gap fails this job
  # on main, so the run stays red and the nightly waits, while the tests still
  # run and a rerun of this job alone clears it. Pull requests skip it:
  # required-checks.test.ts already fails on a renamed job.
  ruleset:
    name: Ruleset check names
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci/required-checks.ts --live

  # One job per runner of CORE_ALL in changes.ts, not a matrix: a skipped job
  # then reports its own fixed name (docs/ci.md#check-names). Each runs when
  # coreRunners lists its label; the quotes keep `ubuntu-24.04` from matching
  # `ubuntu-24.04-arm`. The merge queue leaves out the Intel Mac; pull requests
  # run the Linux x64 one, plus Windows for protection inputs.
  core-linux-x64:
    name: Core tests (Linux x64)
    needs: changes
    if: needs.changes.outputs.core == 'true' && contains(needs.changes.outputs.coreRunners, '"os":"ubuntu-24.04"')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps: &core-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build userspace native helper
        id: native_helper
        if: runner.os == 'Windows' && needs.changes.outputs.nativeWindows == 'true'
        shell: pwsh
        run: |
          Write-Host "Native Windows kernel: $([Environment]::OSVersion.Version)"
          bun packages/core/bin/install-windows-sandbox.ts "$env:RUNNER_TEMP\protected-tool.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun packages/core/bin/install-windows-sandbox.ts "$env:RUNNER_TEMP\protected-tool-mingw.exe" 'C:\mingw64\bin\gcc.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash "$env:RUNNER_TEMP\protected-tool*.exe" -Algorithm SHA256 | Format-List
          & "$env:RUNNER_TEMP\protected-tool.exe" --diagnose-null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "BOITE_WINDOWS_SANDBOX_PATH=$env:RUNNER_TEMP\protected-tool.exe" >> $env:GITHUB_ENV
      - name: LPAC parent creation prerequisite (non-acceptance)
        if: runner.os == 'Windows' && needs.changes.outputs.nativeWindows == 'true'
        continue-on-error: true
        env:
          BOITE_TEST_LPAC_PARENT_SPIKE: '1'
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          bun packages/core/test/windows-lpac-parent-spike.ts "$env:RUNNER_TEMP\lpac-parent-spike"
          $spikeExit = $LASTEXITCODE
          Write-Host "LPAC parent prerequisite exit=$spikeExit; not production acceptance"
          exit $spikeExit
      - name: Preserve LPAC parent prerequisite evidence
        if: always() && runner.os == 'Windows' && needs.changes.outputs.nativeWindows == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-lpac-parent-spike
          path: ${{ runner.temp }}/lpac-parent-spike/
          retention-days: 3
          if-no-files-found: error
      - name: NUL access matrix (non-acceptance)
        if: runner.os == 'Windows' && needs.changes.outputs.nativeWindows == 'true'
        continue-on-error: true
        env:
          BOITE_TEST_NULL_ACCESS_MATRIX: '1'
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          bun packages/core/test/windows-null-access-matrix.ts "$env:RUNNER_TEMP\null-access-matrix"
          $matrixExit = $LASTEXITCODE
          Write-Host "NUL access matrix exit=$matrixExit; not production acceptance"
          exit $matrixExit
      - name: Preserve NUL access matrix evidence
        if: always() && runner.os == 'Windows' && needs.changes.outputs.nativeWindows == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-null-access-matrix
          path: ${{ runner.temp }}/null-access-matrix/
          retention-days: 3
          if-no-files-found: error
      - name: Real Null per-open broker falsifier (non-acceptance)
        if: runner.os == 'Windows' && needs.changes.outputs.nativeWindows == 'true'
        continue-on-error: true
        env:
          BOITE_TEST_NULL_BROKER: '1'
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          bun packages/core/test/windows-null-broker-spike.ts "$env:RUNNER_TEMP\null-broker-spike"
          $brokerExit = $LASTEXITCODE
          Write-Host "Real Null broker falsifier exit=$brokerExit; not production acceptance"
          exit $brokerExit
      - name: Preserve real Null broker evidence
        if: always() && runner.os == 'Windows' && needs.changes.outputs.nativeWindows == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-null-broker-spike
          path: ${{ runner.temp }}/null-broker-spike/
          retention-days: 3
          if-no-files-found: error
      - name: Diagnostic DEBUG_PROCESS descendant marker routing (non-acceptance)
        if: runner.os == 'Windows' && needs.changes.outputs.nativeWindows == 'true'
        continue-on-error: true
        env:
          BOITE_TEST_DEBUG_MAP: '1'
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: pwsh
        run: |
          # Preserve native status explicitly; stderr is diagnostic output, including on PS 5.
          $ErrorActionPreference = 'Continue'
          bun tests/diagnostics/windows-debug-map/run.ts "$env:RUNNER_TEMP\windows-debug-map"
          $diagnosticExit = $LASTEXITCODE
          Set-Content -Path "$env:RUNNER_TEMP\windows-debug-map\launcher-exit.txt" -Value $diagnosticExit
          Write-Host "DEBUG_PROCESS diagnostic exit=$diagnosticExit; not production acceptance"
          exit $diagnosticExit
      - name: Preserve DEBUG_PROCESS diagnostic evidence
        if: always() && runner.os == 'Windows' && needs.changes.outputs.nativeWindows == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-debug-map-diagnostic
          path: ${{ runner.temp }}/windows-debug-map/
          retention-days: 3
          if-no-files-found: error
      - name: Native Windows protected tools
        if: runner.os == 'Windows' && needs.changes.outputs.nativeWindows == 'true'
        env:
          BOITE_TEST_NATIVE_EXECUTION: '1'
          BOITE_DIAGNOSE_JOB_EVENTS: '1'
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: pwsh
        run: |
          $failed = $false
          foreach ($helper in @('protected-tool.exe', 'protected-tool-mingw.exe')) {
            Write-Host "Native fixture helper: $helper"
            $env:BOITE_WINDOWS_SANDBOX_PATH = "$env:RUNNER_TEMP\$helper"
            bun test packages/core/test/protected-windows.test.ts --timeout 120000
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Preserve native helper comparison
        if: always() && runner.os == 'Windows' && needs.changes.outputs.nativeWindows == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: protected-windows-helper-comparison
          path: ${{ runner.temp }}/protected-tool*.exe
          retention-days: 3
      - name: Prepare synthetic native providers
        id: native_providers
        if: ${{ !cancelled() && runner.os == 'Windows' && needs.changes.outputs.nativeWindows == 'true' && steps.native_helper.outcome == 'success' }}
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: bun packages/core/test/fixtures/prepare-native-providers.ts
      - name: Native Windows provider and shared scopes
        if: ${{ !cancelled() && runner.os == 'Windows' && needs.changes.outputs.nativeWindows == 'true' && steps.native_providers.outcome == 'success' }}
        env:
          BOITE_TEST_NATIVE_EXECUTION: '1'
          BOITE_DIAGNOSE_JOB_EVENTS: '1'
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: pwsh
        run: |
          $failed = $false
          foreach ($helper in @('protected-tool.exe', 'protected-tool-mingw.exe')) {
            Write-Host "Native provider/shared fixture helper: $helper"
            $env:BOITE_WINDOWS_SANDBOX_PATH = "$env:RUNNER_TEMP\$helper"
            bun test packages/core/test/protected-drivers.test.ts packages/core/test/protected-adapters.test.ts packages/core/test/shared-access.test.ts -t 'native control|useful edits and child|protected .*(remote jobs|scopes retire)' --timeout 120000
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            bun test packages/core/test/protected-muse.test.ts --timeout 120000
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      # Core data directories, worktrees and Chrome profiles go to the runner's
      # temp drive (D: on Windows), as in the E2E shards (docs/ci.md#build-cost).
      - run: bun run --cwd packages/core test
        if: ${{ !cancelled() && (success() || runner.os == 'Windows' && steps.native_providers.outcome == 'success') }}
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      # The suite above has no DISPLAY and skips the X11 window capture test;
      # this runs that one file against a real X server (docs/ci.md#run-modes-and-platforms).
      - name: X11 window capture and virtual desktop under Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb libx11-6 libxcomposite1 dbus-daemon dbus-bin at-spi2-core openbox
          xvfb-run -a -s "-screen 0 1280x1024x24" bun test packages/core/test/window-capture-x11.test.ts
          bun test packages/core/test/desktop.test.ts

  core-linux-arm64:
    name: Core tests (Linux arm64)
    needs: changes
    if: needs.changes.outputs.core == 'true' && contains(needs.changes.outputs.coreRunners, '"os":"ubuntu-24.04-arm"')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps: *core-steps

  core-windows-x64:
    name: Core tests (Windows x64)
    needs: changes
    if: needs.changes.outputs.core == 'true' && contains(needs.changes.outputs.coreRunners, '"os":"windows-2025"')
    runs-on: windows-2025
    # Two native compiler/provider matrices follow roughly eight minutes of setup.
    timeout-minutes: 30
    steps: *core-steps

  core-macos-arm64:
    name: Core tests (macOS arm64)
    needs: changes
    if: needs.changes.outputs.core == 'true' && contains(needs.changes.outputs.coreRunners, '"os":"macos-15"')
    runs-on: macos-15
    timeout-minutes: 15
    steps: *core-steps

  core-macos-x64:
    name: Core tests (macOS x64)
    needs: changes
    if: needs.changes.outputs.core == 'true' && contains(needs.changes.outputs.coreRunners, '"os":"macos-15-intel"')
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps: *core-steps

  web:
    name: Type checks and UI tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Caches are saved on main only: a pull request's copy is visible to that
      # pull request alone and would evict the ones every pull request restores.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules/.vitest-cache
          key: vitest-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/ui/vitest.config.ts', 'packages/ui/svelte.config.js', 'packages/ui/icon-plugin.ts') }}-${{ github.sha }}
          restore-keys: vitest-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/ui/vitest.config.ts', 'packages/ui/svelte.config.js', 'packages/ui/icon-plugin.ts') }}-
      - run: bun run check
      - run: bun run --cwd packages/ui test --maxWorkers=8
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: github.ref == 'refs/heads/main'
        with:
          path: node_modules/.vitest-cache
          key: vitest-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/ui/vitest.config.ts', 'packages/ui/svelte.config.js', 'packages/ui/icon-plugin.ts') }}-${{ github.sha }}

  telemetry:
    name: Telemetry relay tests
    needs: changes
    if: needs.changes.outputs.telemetry == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun test packages/core/test/telemetry.test.ts

  e2e-types:
    name: E2E type check
    needs: changes
    if: needs.changes.outputs.e2eTypes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run check:e2e

  # The UI the E2E shards and stress test, built once. Vite emits the same
  # chunks on Linux and Windows except for a CSS color rounded in its sixth
  # decimal and the gzip OS byte (docs/ci.md#e2e-preparation).
  ui:
    name: Build UI
    needs: changes
    if: needs.changes.outputs.stress == 'true' || (needs.changes.outputs.desktop == 'true' && needs.changes.outputs.e2e == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run build:ui
      - name: Build the fake-client E2E bundle
        run: bun tests/e2e/lib/warm.ts --build-only tests/e2e/.artifacts/fake-ui
      # The production UI keeps its dot folder: .well-known/assetlinks.json.
      - uses: ./.github/actions/upload-artifact
        with:
          name: ui-dist
          path: packages/ui/dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
      - uses: ./.github/actions/upload-artifact
        with:
          name: ui-e2e-fake
          path: tests/e2e/.artifacts/fake-ui/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  stress:
    name: Stress fixtures
    needs: [changes, ui]
    if: needs.changes.outputs.stress == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      BOITE_E2E_PREBUILT_UI: '1'
      BOITE_STRESS_ARTIFACTS: tests/e2e/.artifacts/stress
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ui-dist
          path: packages/ui/dist
      # Fixed protocol, unhealthy-core and echo fixtures use temporary data only.
      # Preserve all three distinct scenarios and their existing deadlines.
      - run: bun run test:stress
      - uses: ./.github/actions/upload-artifact
        if: always()
        with:
          name: stress-fixture-evidence
          path: tests/e2e/.artifacts/stress/
          retention-days: 7

  # A pull request's sizes, measured on Linux against its base's, which
  # bundle-size.yml keeps for every main commit, and against the last
  # published build plus 2 % (docs/ci.md#bundle-growth). Rerun this job alone
  # after editing the body.
  size:
    name: Bundle size
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.size == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # The base's and the published build's artifacts from main's runs.
      actions: read
      # The pull request body, read at run time so a rerun sees an edit.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run build:ui
      - run: bun run build:core
      - name: Measure
        run: bun scripts/ci/budgets.ts measure .artifacts/bundle-sizes/bundle-sizes.json
      - name: Compare with the base and the ceiling
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bun scripts/ci/budgets.ts check .artifacts/bundle-sizes/bundle-sizes.json

  # The callers of reusable workflows always run and pass `enabled`: a skipped
  # caller reports one check named after itself, a running one each inner
  # job's name, skipped or not (docs/ci.md#check-names).
  desktop:
    name: Desktop
    needs: changes
    uses: ./.github/workflows/desktop.yml
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.sign-updates && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      APPLE_CERTIFICATE: ${{ inputs.sign-updates && secrets.APPLE_CERTIFICATE || '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ inputs.sign-updates && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      APPLE_SIGNING_IDENTITY: ${{ inputs.sign-updates && secrets.APPLE_SIGNING_IDENTITY || '' }}
      APPLE_API_ISSUER: ${{ inputs.sign-updates && secrets.APPLE_API_ISSUER || '' }}
      APPLE_API_KEY_ID: ${{ inputs.sign-updates && secrets.APPLE_API_KEY_ID || '' }}
      APPLE_API_PRIVATE_KEY: ${{ inputs.sign-updates && secrets.APPLE_API_PRIVATE_KEY || '' }}
    with:
      enabled: ${{ needs.changes.outputs.desktop == 'true' }}
      platforms: ${{ needs.changes.outputs.portable }}
      # Only apps/shell, two embedded page scripts and shared inputs reach them (changes.ts).
      rust-tests: ${{ needs.changes.outputs.shellRust == 'true' }}
      sign-updates: ${{ inputs.sign-updates == true }}
      native-e2e: ${{ needs.changes.outputs.e2e == 'true' }}
    permissions:
      contents: read

  # Three shards written out, not a matrix, for the same fixed names as the
  # core jobs. E2E_SHARD picks the shard's files.
  e2e-1:
    name: E2E 1/3
    needs: [changes, ui]
    if: needs.changes.outputs.desktop == 'true' && needs.changes.outputs.e2e == 'true'
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      BOITE_E2E_PREBUILT_UI: '1'
      BOITE_E2E_FAKE_UI: tests/e2e/.artifacts/fake-ui
      E2E_SHARD: 1
    steps: &e2e-steps
      # The test step stops a run still going 4 min before the job's limit,
      # which counts from about the job's start, and leaves a report for the failure
      # captures (scripts/ci/hang-watch.ts, docs/ci.md#hung-test-runs).
      - name: Note when the job started
        run: Add-Content $env:GITHUB_ENV "BOITE_JOB_STARTED_MS=$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ui-dist
          path: packages/ui/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ui-e2e-fake
          path: tests/e2e/.artifacts/fake-ui
      # Chrome profiles and core data directories go to the runner's temp
      # drive (D:). On C:, Chrome stalled page loads for 15 to 60 s while the
      # UI server had answered: 8 stalls in 5 of 9 shard runs against 0 in 9,
      # and 706 s of tests against 420 s (PR #513, 2026-10-15).
      - name: Prepare end-to-end tests
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: bun tests/e2e/lib/warm.ts --prebuilt $env:BOITE_E2E_FAKE_UI
      # Each runner has its own Vite cache. Files stay sequential within a shard.
      # The native shell file runs against the installer in the desktop job.
      # Shards are cut on recorded seconds per file (scripts/ci/e2e-shards.ts).
      - name: Browser and core end-to-end tests
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $files = @(bun scripts/ci/e2e-shards.ts $env:E2E_SHARD 3)
          if ($LASTEXITCODE -ne 0 -or $files.Count -eq 0) { throw 'No browser or core E2E files for this shard' }
          # A quarantined test that fails runs once more (scripts/ci/quarantine.json).
          # --job-minutes is the job's timeout-minutes (e2e-harness.test.ts).
          bun scripts/ci/flaky.ts --job-started $env:BOITE_JOB_STARTED_MS --job-minutes 35 @files
      - uses: ./.github/actions/upload-artifact
        if: failure() || cancelled()
        with:
          name: e2e-${{ env.E2E_SHARD }}-failure-captures
          path: tests/e2e/.artifacts/
          include-hidden-files: true
          retention-days: 7

  e2e-2:
    name: E2E 2/3
    needs: [changes, ui]
    if: needs.changes.outputs.desktop == 'true' && needs.changes.outputs.e2e == 'true'
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      BOITE_E2E_PREBUILT_UI: '1'
      BOITE_E2E_FAKE_UI: tests/e2e/.artifacts/fake-ui
      E2E_SHARD: 2
    steps: *e2e-steps

  e2e-3:
    name: E2E 3/3
    needs: [changes, ui]
    if: needs.changes.outputs.desktop == 'true' && needs.changes.outputs.e2e == 'true'
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      BOITE_E2E_PREBUILT_UI: '1'
      BOITE_E2E_FAKE_UI: tests/e2e/.artifacts/fake-ui
      E2E_SHARD: 3
    steps: *e2e-steps

  server:
    name: Server
    needs: changes
    permissions:
      contents: read
    uses: ./.github/workflows/server-verify.yml
    with:
      enabled: ${{ needs.changes.outputs.server == 'true' }}

  android:
    name: Android
    needs: changes
    uses: ./.github/workflows/android.yml
    with:
      enabled: ${{ needs.changes.outputs.android == 'true' }}

  android-server:
    name: Android server
    needs: changes
    uses: ./.github/workflows/android-server.yml
    with:
      enabled: ${{ needs.changes.outputs.androidServer == 'true' }}
