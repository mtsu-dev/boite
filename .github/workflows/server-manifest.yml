name: server manifest

on:
  workflow_call:
    inputs:
      tags:
        description: Newline-separated image tags, without the image name.
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  manifest:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: server-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform tags
        env:
          IMAGE_TAGS: ${{ inputs.tags }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/boite-server"
          tags=()
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            [[ "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]] || exit 1
            tags+=(--tag "$image:$tag")
          done <<< "$IMAGE_TAGS"
          test "${#tags[@]}" -gt 0
          docker buildx imagetools create "${tags[@]}" "$(<digests/amd64)" "$(<digests/arm64)"
