name: boite (de nuit)

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      announcement:
        description: Optional announcement above the automatic changelog.
        type: string
        default: ''
      dry-run:
        description: Build and test this ref without reserving a tag, signing or publishing anything.
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  # A dry run never waits behind, or replaces, a publishing nightly.
  group: ${{ inputs.dry-run && format('boite-de-nuit-dry-run-{0}', github.ref) || 'boite-de-nuit' }}
  cancel-in-progress: false

jobs:
  # The commit's own CI already ran every suite (scripts/ci/changes.ts): the
  # nightly requires it instead of running it again. A main run cancelled while
  # pending hands the verdict to the push that replaced it, so every job below
  # builds and publishes the commit this one answers with, not github.sha.
  ci:
    name: CI passed
    # Enabled by default; false is the emergency stop for both entry points.
    # Only main publishes; a dry run may build any branch.
    if: vars.NIGHTLY_ENABLED != 'false' && (github.ref == 'refs/heads/main' || inputs.dry-run)
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    permissions:
      contents: read
      # Reruns the failed jobs of that CI run once (scripts/ci/commit-ci.ts).
      actions: write
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Wait for a main commit's CI to pass
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_CI_DRY_RUN: ${{ inputs.dry-run && '1' || '' }}
          COMMIT_CI_FOLLOW: '1'
        run: bun scripts/ci/commit-ci.ts

  revision:
    name: Version
    needs: ci
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.revision.outputs.changed }}
      reserved: ${{ steps.revision.outputs.reserved }}
      tag: ${{ steps.revision.outputs.tag }}
      version: ${{ steps.revision.outputs.version }}
      platforms: ${{ steps.revision.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.ci.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_DRY_RUN: ${{ inputs.dry-run && '1' || '' }}
          NIGHTLY_SHA: ${{ needs.ci.outputs.sha }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > released.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/tags?per_page=100" > tags.json
          # An older commit's planner reads only GITHUB_SHA: hand it the commit whose CI passed.
          GITHUB_SHA="$NIGHTLY_SHA" bun scripts/ci/nightly.ts released.json tags.json

  # Built once per platform and tested as installed; the Rust tests already
  # passed in the commit's CI.
  desktop:
    name: Desktop
    needs: [ci, revision]
    if: needs.revision.outputs.changed == 'true'
    uses: ./.github/workflows/desktop.yml
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ !inputs.dry-run && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      APPLE_CERTIFICATE: ${{ !inputs.dry-run && secrets.APPLE_CERTIFICATE || '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ !inputs.dry-run && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      APPLE_SIGNING_IDENTITY: ${{ !inputs.dry-run && secrets.APPLE_SIGNING_IDENTITY || '' }}
      APPLE_API_ISSUER: ${{ !inputs.dry-run && secrets.APPLE_API_ISSUER || '' }}
      APPLE_API_KEY_ID: ${{ !inputs.dry-run && secrets.APPLE_API_KEY_ID || '' }}
      APPLE_API_PRIVATE_KEY: ${{ !inputs.dry-run && secrets.APPLE_API_PRIVATE_KEY || '' }}
    with:
      ref: ${{ needs.ci.outputs.sha }}
      platforms: ${{ needs.revision.outputs.platforms }}
      channel: nightly
      version: ${{ needs.revision.outputs.version }}
      sign-updates: ${{ !inputs.dry-run }}
      rust-tests: false
      native-e2e: true
    permissions:
      contents: read

  # The tag is taken once the checks pass: the release tags ruleset keeps a tag
  # from being deleted, so one taken before them outlived every failed build.
  reserve:
    name: Reserve tag
    needs: [revision, ci, desktop, image, android, android-server]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Reserve version for this commit
        # A step, not the job, is skipped: a skipped job would skip every job after it.
        if: needs.revision.outputs.reserved != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.revision.outputs.tag }}
          NIGHTLY_SHA: ${{ needs.ci.outputs.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$NIGHTLY_SHA"

  # Signed for the phone app's own address, or the previous release's APK taken
  # back when apps/android, the host and the key are unchanged (docs/internals/android.md).
  # The app's version is its own, not this release's.
  android:
    name: Android
    needs: [ci, revision]
    if: needs.revision.outputs.changed == 'true'
    uses: ./.github/workflows/android.yml
    secrets:
      ANDROID_KEYSTORE: ${{ !inputs.dry-run && secrets.ANDROID_KEYSTORE || '' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ !inputs.dry-run && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
    with:
      ref: ${{ needs.ci.outputs.sha }}
      release: ${{ !inputs.dry-run }}

  # Boite Server, signed with the same key, or the previous release's APK taken
  # back when apps/android-server outside termux/ and the key are unchanged
  # (docs/internals/android-server.md). Its version is its own too.
  android-server:
    name: Android server
    needs: [ci, revision]
    if: needs.revision.outputs.changed == 'true'
    uses: ./.github/workflows/android-server.yml
    secrets:
      ANDROID_KEYSTORE: ${{ !inputs.dry-run && secrets.ANDROID_KEYSTORE || '' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ !inputs.dry-run && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
    with:
      ref: ${{ needs.ci.outputs.sha }}
      release: ${{ !inputs.dry-run }}

  image:
    name: Server image
    needs: [ci, revision]
    if: needs.revision.outputs.changed == 'true'
    uses: ./.github/workflows/server.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ needs.ci.outputs.sha }}
      publish: ${{ !inputs.dry-run }}
      defer-manifest: true
      channel: dev
      version: ${{ needs.revision.outputs.version }}

  publish-image:
    name: Publish image
    needs: [ci, revision, reserve, image]
    uses: ./.github/workflows/server-manifest.yml
    permissions:
      contents: read
      packages: write
    with:
      # The SHA tag is a compatibility alias shared with stable publication;
      # channel/version changes can replace it. Pin the version tag or digest.
      tags: |
        nightly
        ${{ needs.revision.outputs.tag }}
        sha-${{ needs.ci.outputs.sha }}

  release:
    name: Publish release
    needs: [revision, ci, desktop, publish-image, android, android-server]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.ci.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-installer
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: desktop-bundle-*
          merge-multiple: true
          path: artifacts
      # Beside the desktop files, which updater-manifest.ts checks one by one.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: android-apk
          path: android
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: android-server-apk
          path: android-server
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.revision.outputs.tag }}
          RELEASE_ANNOUNCEMENT: ${{ inputs.announcement }}
          NIGHTLY_SHA: ${{ needs.ci.outputs.sha }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > released.json
          bun scripts/ci/changelog.ts released.json artifacts/release-notes.md artifacts android android-server
          bun scripts/ci/updater-manifest.ts artifacts
          existing=$(jq --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | first // empty' released.json)
          cd artifacts
          # updater-manifest.ts refused any file outside this set.
          installers=(./*.exe ./*.deb ./*.AppImage ./*.dmg ./*.app.tar.gz ./boite-server_*.zip)
          sha256sum "${installers[@]}" > SHA256SUMS.txt
          apks=(../android/boite-*.apk)
          test "${#apks[@]}" -eq 1 && test -f "${apks[0]}"
          (cd ../android && sha256sum ./boite-*.apk) >> SHA256SUMS.txt
          server_apks=(../android-server/boite-server-android-*.apk)
          test "${#server_apks[@]}" -eq 1 && test -f "${server_apks[0]}"
          (cd ../android-server && sha256sum ./boite-server-android-*.apk) >> SHA256SUMS.txt
          apks+=("${server_apks[@]}")
          if [[ -n "$existing" ]]; then
            echo "$existing" | jq -e '.draft == true' >/dev/null
            if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
              test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$NIGHTLY_SHA"
            else
              test "$(echo "$existing" | jq -r .target_commitish)" = "$NIGHTLY_SHA"
            fi
            gh release upload "$RELEASE_TAG" "${installers[@]}" "${apks[@]}" ./*.sig latest.json SHA256SUMS.txt --clobber
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" "${installers[@]}" "${apks[@]}" ./*.sig latest.json SHA256SUMS.txt --target "$NIGHTLY_SHA" --title "boite (de nuit) $RELEASE_TAG" --prerelease --latest=false --notes-file release-notes.md
          fi
