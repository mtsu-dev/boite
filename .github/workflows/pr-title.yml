name: pr title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  # The queue needs this required check on its group too (docs/internals/ci.md#merge-queue).
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            package.json
            scripts/ci
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      # A group checks the squash title of its last commit, the one main receives.
      - env:
          PR_TITLE: ${{ github.event.pull_request.title || github.event.merge_group.head_commit.message }}
        run: bun scripts/ci/pr-title.ts
