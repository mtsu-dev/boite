name: app

# The phone app's own address, APP_ORIGIN in the contracts: the UI build served
# as static files by GitHub Pages under the repository's custom domain, with
# /.well-known/assetlinks.json at its root for the Android app. It is the same
# build every core serves, and no core is behind it: the page reaches the
# machines of the group a phone was added to (docs/internals/phone.md).

on:
  push:
    branches: [main]
    paths:
      - packages/ui/**
      - packages/contracts/**
      # The build's own inputs: its script and its dependencies.
      - package.json
      - bun.lock
      - .github/workflows/app.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Phones run what lands here: only a commit whose CI passed is published.
  ci:
    name: CI passed
    # A dispatch from another branch builds only: its commit has no CI on main to wait for.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions:
      contents: read
      # Reruns the failed jobs of that CI run once (scripts/ci/commit-ci.ts).
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Wait for this commit's CI to pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci/commit-ci.ts

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build:ui
      - name: Pack the site
        # What actions/upload-pages-artifact makes, with the dot folder kept:
        # assetlinks.json lives under .well-known.
        run: |
          test -f packages/ui/dist/.well-known/assetlinks.json
          tar --dereference --hard-dereference -cf "$RUNNER_TEMP/artifact.tar" -C packages/ui/dist .
      - uses: ./.github/actions/upload-artifact
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: '1'
          if-no-files-found: error

  deploy:
    needs: [ci, build]
    # Dispatched from another branch, it builds that branch and publishes nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
