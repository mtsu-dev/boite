name: server image

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build; empty builds the caller's own. The nightly passes the one whose CI passed.
        type: string
        default: ''
      publish:
        type: boolean
        default: false
      defer-manifest:
        description: Upload tested image digests now; let the caller publish tags after its checks.
        type: boolean
        default: false
      tags:
        description: Newline-separated image tags, without the image name.
        type: string
        default: edge
      channel:
        type: string
        default: stable
      version:
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    if: '!inputs.publish'
    uses: ./.github/workflows/server-verify.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.ref }}
      channel: ${{ inputs.channel }}
      version: ${{ inputs.version }}

  build:
    if: inputs.publish
    name: test and stage server (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/server-image
        with:
          arch: ${{ matrix.arch }}
          channel: ${{ inputs.channel }}
          version: ${{ inputs.version }}
          release-telemetry: '1'
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested image by digest
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/boite-server"
          tag="$image:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
          docker tag boite-server:test "$tag"
          docker push "$tag"
          mkdir -p digests
          docker inspect --format '{{index .RepoDigests 0}}' "$tag" > "digests/$ARCH"
      - uses: ./.github/actions/upload-artifact
        with:
          name: server-digest-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error
          retention-days: 1

  manifest:
    if: inputs.publish && !inputs.defer-manifest
    needs: build
    uses: ./.github/workflows/server-manifest.yml
    permissions:
      contents: read
      packages: write
    with:
      tags: ${{ inputs.tags }}
