name: desktop

# The desktop builds: the Windows installer and every portable package, each
# built once, tested where it was built and uploaded for publication. ci.yml
# runs them with the shell's Rust tests (on Windows a job of their own beside
# the installer build); the nightly, whose commit already
# passed CI, keeps only what proves the shipped files: installer regressions,
# native shell E2E and the installed-package smoke tests.

on:
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        description: Required only when sign-updates is enabled.
        required: false
      # A published macOS build is signed with this Developer ID and notarized
      # when all six are set; without them it stays ad-hoc signed.
      APPLE_CERTIFICATE:
        description: Base64 of the Developer ID Application .p12.
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        description: 'Developer ID Application: <name> (<team id>).'
        required: false
      APPLE_API_ISSUER:
        description: App Store Connect API issuer ID, for notarization.
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_PRIVATE_KEY:
        description: Contents of the AuthKey_<id>.p8 file.
        required: false
    inputs:
      ref:
        description: The commit to build; empty builds the caller's own. The nightly passes the one whose CI passed.
        type: string
        default: ''
      enabled:
        description: Off skips every job, which still reports its own check name; ci.yml turns it off when no desktop input changed.
        type: boolean
        default: true
      platforms:
        description: JSON list of portable platforms, as scripts/ci/changes.ts writes them.
        type: string
        required: true
      channel:
        type: string
        default: stable
      version:
        type: string
        default: ''
      sign-updates:
        type: boolean
        default: false
      rust-tests:
        description: Run the shell's Rust unit and window tests before packaging.
        type: boolean
        default: true
      native-e2e:
        description: Drive the built Windows shell with tests/e2e/shell.test.ts.
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 8

jobs:
  # The test build turns on `tauri/test` and leaves out `custom-protocol`, so
  # it shares only the dependencies below Tauri with the installer build and
  # needs neither the UI nor the staged core: in the installer job it ran
  # 97 to 102 s after a 221 s build. It restores that build's cache and saves
  # none, which the installer job owns.
  windows-rust:
    name: Windows x64 Rust tests
    if: inputs.enabled && inputs.rust-tests
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: apps/shell/src-tauri -> target
          shared-key: desktop-release-v2
          save-if: false
      - name: Shell Rust tests
        run: bun run test:shell --release
      - name: Windows CLI launcher tests
        run: cargo test --locked --manifest-path apps/shell/launcher/Cargo.toml

  windows:
    name: Windows x64
    if: inputs.enabled
    runs-on: windows-2025
    # A published build compiles the shell and its dependencies with fat LTO,
    # which the cache saved from pull-request settings does not hold.
    timeout-minutes: ${{ inputs.sign-updates && 60 || 35 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: apps/shell/src-tauri -> target
          # v2: v1 held crates built with an explicit release profile, which no build uses any more.
          shared-key: desktop-release-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Set nightly artifact version
        if: inputs.channel == 'nightly' && inputs.version != ''
        env:
          NIGHTLY_VERSION: ${{ inputs.version }}
        run: bun scripts/ci/nightly-build.ts
      - name: Build installer once
        env:
          BUILD_CHANNEL: ${{ inputs.channel }}
          BOITE_SIGN_UPDATES: ${{ inputs.sign-updates && '1' || '0' }}
          # Only a published installer reports to the analytics relay; a pull
          # request's build stays silent (docs/analytics.md).
          BOITE_RELEASE_TELEMETRY: ${{ inputs.sign-updates && '1' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.sign-updates && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
        run: |
          # A published shell is built with fat LTO over one codegen unit, about
          # 7 more minutes; only this step, so the Rust tests keep Cargo's
          # defaults. Any other build sets neither: even `16`, the default,
          # changes every crate's fingerprint and misses the cache (docs/ci.md#build-cost).
          if ($env:BOITE_SIGN_UPDATES -eq '1') {
            $env:CARGO_PROFILE_RELEASE_LTO = 'fat'
            $env:CARGO_PROFILE_RELEASE_CODEGEN_UNITS = '1'
          }
          if ($env:BUILD_CHANNEL -eq 'nightly') {
            bun run build:shell:nightly
          } elseif ($env:BUILD_CHANNEL -eq 'stable') {
            bun run build:shell
          } else {
            throw "Unsupported build channel: $env:BUILD_CHANNEL"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run apps/shell/scripts/stage-sidecar.ts
      - name: Windows installer regression tests
        env:
          BOITE_CI_INSTALLER_REQUIRED: '1'
        run: bun test scripts/ci/installer-shortcuts.test.ts scripts/ci/installer-hooks.test.ts scripts/ci/stop-core.test.ts scripts/ci/installed-cli-windows.test.ts
      # Test shells keep their data directory, WebView2 profile included, on
      # the runner's temp drive (D:), as the E2E shards do (docs/ci.md). On C:,
      # a fresh profile's cookie database held the first document request for
      # up to 10 s.
      - name: Native shell end-to-end tests
        if: inputs.native-e2e
        env:
          BOITE_E2E_PREBUILT_UI: '1'
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: bun test tests/e2e/shell.test.ts
      - uses: ./.github/actions/upload-artifact
        with:
          name: windows-installer
          path: |
            apps/shell/src-tauri/target/release/bundle/nsis/*.exe
            apps/shell/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: ./.github/actions/upload-artifact
        if: failure() || cancelled()
        with:
          name: desktop-failure-captures
          path: tests/e2e/.artifacts/
          include-hidden-files: true
          retention-days: 7

  # One job per platform of PORTABLE_ALL in scripts/ci/changes.ts, not a
  # matrix, so a skipped one reports its fixed name (docs/ci.md#check-names).
  # Each runs when `platforms` lists its id. PORTABLE_ID and PORTABLE_RUNNER
  # stand in for the matrix in the shared steps.
  portable-linux-x64:
    name: Linux x64
    if: inputs.enabled && contains(inputs.platforms, '"id":"linux-x64"')
    runs-on: ubuntu-22.04
    # A published build compiles the shell and its dependencies with fat LTO,
    # which the cache saved from pull-request settings does not hold.
    timeout-minutes: ${{ inputs.sign-updates && 60 || 35 }}
    env:
      PORTABLE_ID: linux-x64
      PORTABLE_RUNNER: ubuntu-22.04
      # A cross build: compile.ts, stage-sidecar.ts, tauri.ts and desktop-bundles.ts all read it.
      BOITE_TARGET: ''
    steps: &portable-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install Linux shell dependencies
        if: runner.os == 'Linux'
        run: |
          # These packages come from Ubuntu, independent of the runner's other feeds.
          ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
          if [ ! -s "$ubuntu_sources" ]; then ubuntu_sources=/etc/apt/sources.list; fi
          test -s "$ubuntu_sources"
          apt_sources=(-o "Dir::Etc::sourcelist=$ubuntu_sources" -o "Dir::Etc::sourceparts=-")
          sudo apt-get "${apt_sources[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${apt_sources[@]}" install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb dbus-x11 xdg-utils
      - name: Run Intel binaries under Rosetta
        if: runner.os == 'macOS' && env.BOITE_TARGET == 'x86_64-apple-darwin'
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: ${{ env.BOITE_TARGET }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: apps/shell/src-tauri -> target
          # Per runner and target: a cache built on Ubuntu 24.04 restored on 22.04 left crates rustc could not load.
          # v2: v1 held crates built with an explicit release profile, which no build uses any more.
          shared-key: desktop-portable-${{ env.PORTABLE_RUNNER }}${{ env.BOITE_TARGET && format('-{0}', env.BOITE_TARGET) || '' }}-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Set nightly artifact version
        if: inputs.channel == 'nightly' && inputs.version != ''
        env:
          NIGHTLY_VERSION: ${{ inputs.version }}
        run: bun scripts/ci/nightly-build.ts
      - name: Choose channel and updater signing key
        env:
          BUILD_CHANNEL: ${{ inputs.channel }}
          SIGN_UPDATES: ${{ inputs.sign-updates && '1' || '0' }}
        run: |
          case "$BUILD_CHANNEL" in
            stable) configs='--config src-tauri/tauri.bundle.conf.json' ;;
            nightly) configs='--config src-tauri/tauri.bundle.conf.json --config src-tauri/tauri.nightly.conf.json' ;;
            *) echo "Unsupported build channel: $BUILD_CHANNEL" >&2; exit 1 ;;
          esac
          {
            echo "BUNDLE_CONFIGS=$configs"
            echo "BUNDLE_DIR=apps/shell/src-tauri/target/${BOITE_TARGET:+$BOITE_TARGET/}release/bundle"
            echo "BOITE_SIGN_UPDATES=1"
          } >> "$GITHUB_ENV"
          # An unpublished build signs with a throwaway key, so every run proves
          # the signed updater payloads a release needs from this runner.
          if [ "$SIGN_UPDATES" != 1 ]; then
            bun run --cwd apps/shell tauri signer generate --ci -w "$RUNNER_TEMP/throwaway-updater.key" > /dev/null
            echo "THROWAWAY_UPDATER_KEY=$RUNNER_TEMP/throwaway-updater.key" >> "$GITHUB_ENV"
          fi
      - run: bun run stage:core
        env:
          # Only a published package reports to the analytics relay (docs/analytics.md).
          BOITE_RELEASE_TELEMETRY: ${{ inputs.sign-updates && '1' || '' }}
      # A cross build runs its tests as Intel binaries under Rosetta.
      - name: Shell Rust tests
        if: inputs.rust-tests
        run: bun run test:shell --release ${BOITE_TARGET:+--target "$BOITE_TARGET"}
      - name: macOS native toolbar regression
        if: inputs.rust-tests && runner.os == 'macOS'
        run: cargo test --locked --manifest-path apps/shell/src-tauri/Cargo.toml --release ${BOITE_TARGET:+--target "$BOITE_TARGET"} --test macos-window
      - name: Build and test installed Linux package
        if: runner.os == 'Linux'
        env:
          # Fat LTO for a published shell, as in the Windows job.
          SHIP_PROFILE: ${{ inputs.sign-updates && '1' || '0' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.sign-updates && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
        run: |
          export TAURI_SIGNING_PRIVATE_KEY="${TAURI_SIGNING_PRIVATE_KEY:-${THROWAWAY_UPDATER_KEY:-}}"
          if [ "$SHIP_PROFILE" = 1 ]; then
            export CARGO_PROFILE_RELEASE_LTO=fat CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1
          fi
          # shellcheck disable=SC2086 # BUNDLE_CONFIGS holds several arguments.
          bun apps/shell/scripts/tauri.ts build $BUNDLE_CONFIGS --bundles deb
          sudo dpkg -i "$BUNDLE_DIR"/deb/*.deb
          dbus-run-session -- xvfb-run -a bun scripts/ci/desktop-smoke.ts /usr/bin/boite-shell
      - name: Bundle and test Linux AppImage
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.sign-updates && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
        run: |
          export TAURI_SIGNING_PRIVATE_KEY="${TAURI_SIGNING_PRIVATE_KEY:-${THROWAWAY_UPDATER_KEY:-}}"
          # The bundler downloads AppRun and linuxdeploy from GitHub releases on
          # every run. A 5xx there is retried; any other failure stops the job.
          set -o pipefail
          log="$RUNNER_TEMP/appimage-bundle.log"
          for attempt in 1 2 3; do
            # shellcheck disable=SC2086 # BUNDLE_CONFIGS holds several arguments.
            if bun apps/shell/scripts/tauri.ts bundle $BUNDLE_CONFIGS --bundles appimage --verbose 2>&1 | tee "$log"; then break; fi
            if [ "$attempt" = 3 ] || ! grep -qE 'failed to bundle project: .http status: 5[0-9]{2}' "$log"; then exit 1; fi
            echo "::warning::AppImage tool download failed with a server error (attempt $attempt of 3); retrying in $((attempt * 30)) s"
            sleep $((attempt * 30))
          done
          mkdir "$RUNNER_TEMP/appimage"
          appimage=$(realpath "$BUNDLE_DIR"/appimage/*.AppImage)
          (cd "$RUNNER_TEMP/appimage" && "$appimage" --appimage-extract > /dev/null)
          if [ "$(uname -m)" = aarch64 ]; then
            cmp packages/core/dist/boite-core "$RUNNER_TEMP/appimage/squashfs-root/usr/bin/boite-core"
          fi
          dbus-run-session -- xvfb-run -a bun scripts/ci/desktop-smoke.ts "$RUNNER_TEMP/appimage/squashfs-root/AppRun"
      - name: Build and test macOS application bundle
        if: runner.os == 'macOS'
        env:
          # Fat LTO for a published shell, as in the Windows job.
          SHIP_PROFILE: ${{ inputs.sign-updates && '1' || '0' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.sign-updates && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          DEVELOPER_ID_CERTIFICATE: ${{ inputs.sign-updates && secrets.APPLE_CERTIFICATE || '' }}
          DEVELOPER_ID_PASSWORD: ${{ inputs.sign-updates && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          DEVELOPER_ID_IDENTITY: ${{ inputs.sign-updates && secrets.APPLE_SIGNING_IDENTITY || '' }}
          NOTARY_ISSUER: ${{ inputs.sign-updates && secrets.APPLE_API_ISSUER || '' }}
          NOTARY_KEY_ID: ${{ inputs.sign-updates && secrets.APPLE_API_KEY_ID || '' }}
          NOTARY_PRIVATE_KEY: ${{ inputs.sign-updates && secrets.APPLE_API_PRIVATE_KEY || '' }}
        run: |
          export TAURI_SIGNING_PRIVATE_KEY="${TAURI_SIGNING_PRIVATE_KEY:-${THROWAWAY_UPDATER_KEY:-}}"
          if [ "$SHIP_PROFILE" = 1 ]; then
            export CARGO_PROFILE_RELEASE_LTO=fat CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1
          fi
          if [ -n "$DEVELOPER_ID_CERTIFICATE" ] && [ -n "$DEVELOPER_ID_PASSWORD" ] && [ -n "$DEVELOPER_ID_IDENTITY" ] \
            && [ -n "$NOTARY_ISSUER" ] && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_PRIVATE_KEY" ]; then
            # Tauri imports the certificate into a temporary keychain, signs the
            # app and its sidecar, then notarizes and staples with the API key.
            printf '%s' "$NOTARY_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey_$NOTARY_KEY_ID.p8"
            export APPLE_CERTIFICATE="$DEVELOPER_ID_CERTIFICATE" APPLE_CERTIFICATE_PASSWORD="$DEVELOPER_ID_PASSWORD"
            export APPLE_SIGNING_IDENTITY="$DEVELOPER_ID_IDENTITY" APPLE_API_ISSUER="$NOTARY_ISSUER"
            export APPLE_API_KEY="$NOTARY_KEY_ID" APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_$NOTARY_KEY_ID.p8"
            notarized=1
          else
            # Ad-hoc: Gatekeeper asks once before the first start (README).
            export APPLE_SIGNING_IDENTITY='-'
            notarized=0
          fi
          # A busy disk image is bundled again; any other failure stops here.
          # shellcheck disable=SC2086 # BUNDLE_CONFIGS holds several arguments.
          bun scripts/ci/hdiutil-retry.ts "$BUNDLE_DIR" -- bun apps/shell/scripts/tauri.ts build $BUNDLE_CONFIGS --bundles app,dmg --verbose
          cp -R "$BUNDLE_DIR/macos/Boite.app" "$RUNNER_TEMP/Boite.app"
          # Dictation: without both, macOS refuses or kills the microphone request.
          plutil -extract NSMicrophoneUsageDescription raw "$RUNNER_TEMP/Boite.app/Contents/Info.plist"
          codesign -d --entitlements - --xml "$RUNNER_TEMP/Boite.app" | grep -q com.apple.security.device.audio-input
          if [ "$notarized" = 1 ]; then
            xcrun stapler validate "$RUNNER_TEMP/Boite.app"
            spctl --assess --type execute --verbose "$RUNNER_TEMP/Boite.app"
          fi
          if [ -n "$BOITE_TARGET" ]; then
            # The Intel shell and its sidecar, run under Rosetta by the smoke test below.
            lipo -archs "$RUNNER_TEMP/Boite.app/Contents/MacOS/boite-shell" | grep -qx x86_64
            lipo -archs "$RUNNER_TEMP/Boite.app/Contents/MacOS/boite-core" | grep -qx x86_64
            # Rosetta translates both on first start on a fresh runner; the
            # 30 s native budget expired on about half of the 2026-10-13 runs.
            export BOITE_SMOKE_STARTUP_SECONDS=90
          fi
          bun scripts/ci/desktop-smoke.ts "$RUNNER_TEMP/Boite.app/Contents/MacOS/boite-shell"
      - name: Collect release bundles
        run: bun scripts/ci/desktop-bundles.ts "$RUNNER_TEMP/desktop-bundles"
      - name: Bundle and sign standalone Linux server
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.sign-updates && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
        run: |
          if [ -n "${THROWAWAY_UPDATER_KEY:-}" ]; then
            unset TAURI_SIGNING_PRIVATE_KEY
            export TAURI_SIGNING_PRIVATE_KEY_PATH="$THROWAWAY_UPDATER_KEY"
          fi
          file=$(bun scripts/ci/server-bundle.ts "$RUNNER_TEMP/desktop-bundles")
          version=$(bun -e 'console.log(require("./package.json").version)')
          bun run --cwd apps/shell tauri signer sign --password '' --app-version "$version" "$file"
          # The Android server ships the core's scripts, the same on every runner: one bundle, from x64.
          if [ "$PORTABLE_ID" = linux-x64 ]; then
            file=$(bun scripts/ci/android-server-bundle.ts "$RUNNER_TEMP/desktop-bundles")
            bun run --cwd apps/shell tauri signer sign --password '' --app-version "$version" "$file"
          fi
      - name: Diagnose Linux packaging failures
        if: failure() && runner.os == 'Linux'
        run: |
          patchelf --version
          for binary in packages/core/dist/boite-core "$BUNDLE_DIR"/appimage/Boite.AppDir/usr/bin/boite-core; do
            if [ -f "$binary" ]; then
              file "$binary"
              ldd "$binary" || true
            fi
          done
      # release.yml and nightly.yml publish every desktop-bundle-* artifact.
      - uses: ./.github/actions/upload-artifact
        with:
          name: desktop-bundle-${{ env.PORTABLE_ID }}
          path: ${{ runner.temp }}/desktop-bundles/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  portable-linux-arm64:
    name: Linux arm64
    if: inputs.enabled && contains(inputs.platforms, '"id":"linux-arm64"')
    runs-on: ubuntu-22.04-arm
    timeout-minutes: ${{ inputs.sign-updates && 60 || 35 }}
    env:
      PORTABLE_ID: linux-arm64
      PORTABLE_RUNNER: ubuntu-22.04-arm
      BOITE_TARGET: ''
    steps: *portable-steps

  portable-macos-arm64:
    name: macOS arm64
    if: inputs.enabled && contains(inputs.platforms, '"id":"macos-arm64"')
    runs-on: macos-15
    timeout-minutes: ${{ inputs.sign-updates && 60 || 35 }}
    env:
      PORTABLE_ID: macos-arm64
      PORTABLE_RUNNER: macos-15
      BOITE_TARGET: ''
    steps: *portable-steps

  portable-macos-x64:
    name: macOS x64
    if: inputs.enabled && contains(inputs.platforms, '"id":"macos-x64"')
    runs-on: macos-15
    timeout-minutes: ${{ inputs.sign-updates && 60 || 35 }}
    env:
      PORTABLE_ID: macos-x64
      PORTABLE_RUNNER: macos-15
      BOITE_TARGET: x86_64-apple-darwin
    steps: *portable-steps
