name: Feature request
description: Describe a workflow boite could support.
type: Feature
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Most features can be built as a plugin, without a change to boite: agent commands, skills, slash commands and background services. Read the [plugin docs](https://github.com/mtsu-dev/boite/blob/main/docs/internals/plugins.md) first. Ask here for what a plugin cannot do yet.
  - type: textarea
    id: workflow
    attributes:
      label: What are you trying to do?
      description: Explain the problem and how you work around it today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
  - type: checkboxes
    id: search
    attributes:
      label: Existing issues
      options:
        - label: I searched the open and closed issues for this request.
          required: true
